# Render Blueprint: Render > New > Blueprint > pick this repository.
# The site stores its data in Supabase (PostgreSQL). Secrets are left blank here and filled in on Render.
services:
  - type: web
    name: chaloschools
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate --schema prisma/schema.postgres.prisma && npm run build
    startCommand: npm start
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PRISMA_SCHEMA
        value: prisma/schema.postgres.prisma
      # Supabase > Project Settings > Database > Connection string. DATABASE_URL is the pooled one (port 6543, add
      # ?pgbouncer=true&connection_limit=1 at the end); DIRECT_URL is the direct one (port 5432).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: SITE_NAME
        value: ChaloSchools
      # Set these when the real domain and tracking IDs are ready (leave blank until then):
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      - key: NEXT_PUBLIC_GTM_ID
        sync: false
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false
